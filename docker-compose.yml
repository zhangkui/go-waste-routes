services:
  mysql:
    image: mysql:8.4.0
    container_name: go-waste-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-go_waste_routes}
      MYSQL_USER: ${DB_USER:-waste_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-waste_pass_2026}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4.10-bookworm
    container_name: go-waste-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: go-waste-api
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-waste_user}
      DB_PASSWORD: ${DB_PASSWORD:-waste_pass_2026}
      DB_NAME: ${DB_NAME:-go_waste_routes}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: go-waste-frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  mysql-data:
  redis-data:
